  if(ng && ng.indexOf(nq)>=0) return {hit:true,via:"gen"};
  return {hit:false,via:null};
}
// 検索語をマスタ経由で一般名に展開（商品名で打っても同一成分の別銘柄データを拾う）
function expandTerms(q){
  var list=[{t:q,m:false}];
  var nq=norm(q);
  if(!nq) return list;
  var seen={};
  for(var i=0;i<DATA.master.length;i++){
    var mm=DATA.master[i];
    if(mm.gen && norm(mm.name).indexOf(nq)>=0 && !seen[mm.gen]){
      seen[mm.gen]=1; list.push({t:mm.gen,m:"gen"});
    }
  }
  if(DATA.simGroups){
    for(var gi=0;gi<DATA.simGroups.length;gi++){
      var grp=DATA.simGroups[gi], fire=false, a;
      for(a=0;a<grp.length;a++){ var k=norm(grp[a]); if(k&&(nq.indexOf(k)>=0||k.indexOf(nq)>=0)){fire=true;break;} }
      if(fire){ for(a=0;a<grp.length;a++){ list.push({t:grp[a],m:"sim"}); } }
    }
  }
  return list;
}
// 展開済み検索語で照合。商品名一致を優先、マスタ由来語(m)経由の一致は一般名扱い(警告)
function matchFieldX(name,gen,terms){
  if(terms.length===1 && !norm(terms[0].t)) return {hit:true,via:null};
  var nn=norm(name),ng=norm(gen),i,nt;
  for(i=0;i<terms.length;i++){ nt=norm(terms[i].t); if(!nt) continue;
    if(nn.indexOf(nt)>=0) return {hit:true,via: terms[i].m||"name"}; }
  for(i=0;i<terms.length;i++){ nt=norm(terms[i].t); if(!nt) continue;
    if(ng && ng.indexOf(nt)>=0) return {hit:true,via:"gen"}; }
  return {hit:false,via:null};
}
function cardHtml(p){
  var s=STATUS[p.judge]||{cls:"nodata",label:"?"};
  var genA=p.genA||"", genB=p.gen||"";
  var genLine=(genA||genB)?'<span class="gen">'+[genA,genB].filter(Boolean).join(' ／ ')+'</span>':'';
  var names;
  if(viewStyle==="dir"){
    names='<span class="base">'+p.a+'</span><span class="joiner">に</span>'+
          '<span class="partner">'+p.b+'</span><span class="joiner">を配合した試験</span>'+genLine;
  } else {
    names='<span class="basebadge">基剤</span><span class="base">'+p.a+'</span>'+
          '<span class="joiner">＋</span><span class="partner">'+p.b+'</span>'+genLine;
  }
  var warn = p._viaSim ? '<div class="warn">⚠ 類似製剤の参考です。「'+p.b+'」は検索した薬剤と<b>同一成分ではありません</b>（類似製剤の試験値）。参考としてご確認ください。</div>' : (p._viaGen ? '<div class="warn">⚠ 一般名での一致です。この結果は「'+p.b+'」（基剤：'+p.a+'）の試験値です。採用している銘柄が異なる場合、結果が異なることがあります。</div>' : '');
  return '<div class="card b-'+s.cls+'"><div class="card-top">'+
    '<span class="mk m-'+s.cls+'">'+p.judge+'</span>'+
    '<div class="pairnames">'+names+'</div></div>'+ warn +
    '<div class="card-detail"><b>判定</b> '+s.label+' ／ <b>時点</b> '+(p.time||"—")+'<br>'+
    '<b>配合条件</b> '+(p.cond||"—")+'<br>'+
    '<b>変化</b> '+(p.change||"—")+'<br>'+
    (p.note?'<b>備考</b> '+p.note+' <span style="color:#b7791f">（'+p.a+'側の試験値）</span><br>':'')+
    '<b>根拠</b> '+(p.ref||"—")+'</div></div>';
}
function render(){
  var out=document.getElementById("result");
  if(!lastRows.length){ out.innerHTML='<div class="placeholder">商品名か一般名を入力して検索してください</div>'; return; }
  var html='<div class="rescount">'+lastRows.length+'件の配合データ（○△×の順）</div>';
  html+=lastRows.map(cardHtml).join("");
  out.innerHTML=html;
}
function doSearch(){
  var qa=document.getElementById("qA").value.trim();
  var qb=document.getElementById("qB").value.trim();
  var out=document.getElementById("result");
  if(!qa && !qb){ lastRows=[]; out.innerHTML='<div class="placeholder">商品名か一般名を入力して検索してください</div>'; return; }
  var rows=[];
  var termsA=expandTerms(qa), termsB=expandTerms(qb);
  DATA.pairs.forEach(function(p){
    var fa=matchFieldX(p.a,p.genA,termsA), fb=matchFieldX(p.b,p.gen,termsB);
    var ra=matchFieldX(p.a,p.genA,termsB), rb=matchFieldX(p.b,p.gen,termsA);
    var fwd=fa.hit&&fb.hit, rev=ra.hit&&rb.hit;
    if(!(fwd||rev)) return;
    var viaGen=false, viaSim=false;
    if(fwd && (fa.via==="gen"||fb.via==="gen")) viaGen=true;
    if(rev && (ra.via==="gen"||rb.via==="gen")) viaGen=true;
    if(fwd && (fa.via==="sim"||fb.via==="sim")) viaSim=true;
    if(rev && (ra.via==="sim"||rb.via==="sim")) viaSim=true;
    // 商品名だけで一致する経路が別にあれば警告なし
    var na=norm(p.a), nb=norm(p.b), nqa=norm(qa), nqb=norm(qb);
    var nameOnly = ((!qa||na.indexOf(nqa)>=0)&&(!qb||nb.indexOf(nqb)>=0)) ||
                   ((!qb||na.indexOf(nqb)>=0)&&(!qa||nb.indexOf(nqa)>=0));
    if(nameOnly){ viaGen=false; viaSim=false; }
    p._viaGen=viaGen; p._viaSim=viaSim;
    rows.push(p);
  });
  var seen={},uniq=[];
  rows.forEach(function(p){ var k=p.a+"|"+p.b+"|"+p.cond; if(!seen[k]){seen[k]=1;uniq.push(p);} });
  var order={"×":0,"△":1,"○":2};
  uniq.sort(function(x,y){ return (order[x.judge]||9)-(order[y.judge]||9); });
  lastRows=uniq;
  if(!uniq.length){ out.innerHTML='<div class="placeholder">該当する配合データが見つかりませんでした。<br>別の表記や一般名でもお試しください。</div>'; return; }
  render();
}
document.getElementById("btn").addEventListener("click", doSearch);
document.getElementById("qA").addEventListener("keydown",function(e){ if(e.key==="Enter") doSearch(); });
document.getElementById("qB").addEventListener("keydown",function(e){ if(e.key==="Enter") doSearch(); });
Array.prototype.forEach.call(document.querySelectorAll(".styletoggle button"), function(b){
  b.addEventListener("click", function(){
    viewStyle=b.getAttribute("data-s");
    Array.prototype.forEach.call(document.querySelectorAll(".styletoggle button"), function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    render();
  });
});
</script></body></html>
